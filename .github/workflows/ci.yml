name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install safety-probe
        run: pip install "git+https://github.com/SarnadAbhilash/safety-probe.git"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check adaptive_redteam/

      - name: Type check
        run: mypy adaptive_redteam/

      - name: Test
        run: pytest tests/ -v --tb=short
