[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-redteam"
version = "0.1.0"
description = "Adaptive prompt optimization for discovering behavioral failure modes in LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Abhilash Sarnad" }]
keywords = ["llm", "safety", "red-teaming", "adversarial", "alignment", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/SarnadAbhilash/adaptive-redteam"
"Bug Tracker" = "https://github.com/SarnadAbhilash/adaptive-redteam/issues"

dependencies = [
    # Install safety-probe first: pip install -e ../safety-probe
    "safety-probe",
    "numpy>=1.26",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
adaptive-redteam = "adaptive_redteam.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adaptive_redteam*"]

[tool.setuptools.package-data]
adaptive_redteam = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["adaptive_redteam"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
